<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jack's Solution &amp; Close — Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+Arabic:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Show-section (comic) design tokens — see the SALESSHOWSTYLEGUIDE repo.
     Speakers renamed from the guide's --ana/--jack to --con/--jack: the
     consultant is unnamed in this scenario. The guide sanctions renaming the
     speaker tokens as long as one stays navy-ish and one high-contrast. */
  :root{
    --navy:#002856; --navy-deep:#001838; --red:#E4032E;
    --sky:#dcebf9; --paper:#f6f9fd; --ink:#132441; --muted:#5a6b85;
    --con:#002856; --jack:#ffffff; --jackink:#132441;
    --panel-border:#101828;
    /* fullscreen affordance -- shared verbatim with the Do section. Player
       chrome, so it is the one component that does NOT take on this
       section's comic vocabulary. See STYLE_GUIDE.md. */
    --fs-green:#127A47; --fs-green-deep:#0D5F37;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    background:#0b1424;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .stage{
    width:min(920px,96vw); height:min(620px,92vh);
    background:var(--paper); display:flex;flex-direction:column;
    position:relative;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.55);border-radius:16px;
    transform:scale(var(--fs-scale,1));transform-origin:center center;
  }
  @media(max-width:620px){ .stage{width:100vw;height:100vh;border-radius:0} .bubble{max-width:80%} }

  /* ---------- top bar ---------- */
  .topbar{background:linear-gradient(180deg,var(--navy-deep),var(--navy));color:#fff;padding:12px 16px 11px;flex-shrink:0;z-index:6}
  .topbar .row{display:flex;align-items:center;gap:10px;padding-inline-end:150px}
  .topbar .title{font-weight:800;font-size:14px;flex:1}
  .topbar .count{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums;font-weight:700}
  .rail{display:flex;gap:4px;margin-top:10px}
  .seg{flex:1}
  .seg .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.18);transition:background .5s}
  .seg .lab{font-size:7.4px;letter-spacing:.03em;text-transform:uppercase;margin-top:4px;opacity:.45;text-align:center;font-weight:700;white-space:nowrap;overflow:hidden}
  .seg.done .bar{background:var(--sky)} .seg.done .lab{opacity:.7}
  .seg.now .bar{background:var(--red)} .seg.now .lab{opacity:1;color:#fff}

  /* ---------- comic panel ----------
     Four layers, all required: photo, halftone, vignette, flash. Removing
     any one flattens the comic feel back into a plain photo. */
  .panel{flex:1;position:relative;overflow:hidden;background:#222}
  .panel .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:center 28%;filter:saturate(1.12) contrast(1.06);}
  .panel .halftone{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.18;
    background-image:radial-gradient(rgba(0,20,60,.9) 1px, transparent 1.4px);background-size:5px 5px;}
  .panel .vignette{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 90px 20px rgba(3,10,25,.45);}
  .panel .flash{position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(circle at var(--fx,50%) 42%, rgba(228,3,46,.16), transparent 55%);transition:opacity .5s}

  /* Jack sits on the left of frame, the Consultant on the right — the photo
     fixes that, so the guide's who:0=left mapping points at Jack here. */
  .nameplate{position:absolute;top:12px;padding:5px 12px;font-family:'Bangers',cursive;letter-spacing:.06em;
    font-size:17px;color:#fff;border:2.5px solid #fff;border-radius:6px;transform:rotate(-2deg);
    box-shadow:3px 3px 0 rgba(0,0,0,.35);transition:opacity .3s;z-index:4}
  .nameplate.jack{left:14px;background:var(--red)}
  .nameplate.con{right:14px;background:var(--navy);transform:rotate(2deg)}
  .nameplate.dim{opacity:.28}

  /* ---------- speech bubbles ---------- */
  .bubbles{position:absolute;inset:0;padding:56px 16px 16px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;z-index:3;scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){ .bubbles{scroll-behavior:auto} }
  .bubbles::-webkit-scrollbar{width:0}
  .bubble{max-width:56%;padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.48;
    position:relative;animation:pop .32s cubic-bezier(.2,1.3,.5,1) both;
    box-shadow:3px 3px 0 rgba(0,0,0,.28);border:2.5px solid var(--panel-border)}
  @keyframes pop{from{opacity:0;transform:scale(.8) translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ .bubble{animation:none} }
  .bubble .sp{font-family:'Bangers',cursive;letter-spacing:.05em;font-size:13px;display:block;margin-bottom:2px;opacity:.8}
  .bubble.jack{align-self:flex-start;background:var(--jack);color:var(--jackink);border-bottom-left-radius:5px}
  .bubble.jack .sp{color:var(--red)}
  .bubble.jack::after{content:"";position:absolute;left:16px;bottom:-13px;border:7px solid transparent;
    border-top-color:var(--jack);border-right-color:var(--jack);filter:drop-shadow(2px 2px 0 var(--panel-border))}
  .bubble.con{align-self:flex-end;background:var(--con);color:#fff;border-bottom-right-radius:5px}
  .bubble.con .sp{color:var(--sky)}
  .bubble.con::after{content:"";position:absolute;right:16px;bottom:-13px;border:7px solid transparent;
    border-top-color:var(--con);border-left-color:var(--con)}
  .bubble.dimmed{opacity:.42;filter:saturate(.7)}
  .bubble.thinking{font-family:'Bangers',cursive;letter-spacing:.1em;font-size:18px}

  /* caption chip (technique / phase) */
  .capwrap{display:flex;justify-content:center;position:relative;z-index:3}
  .cap{font-family:'Bangers',cursive;letter-spacing:.08em;font-size:14px;color:#fff;background:var(--red);
    border:2.5px solid var(--panel-border);border-radius:7px;padding:4px 14px;transform:rotate(-1.5deg);
    box-shadow:3px 3px 0 rgba(0,0,0,.3);animation:slam .35s cubic-bezier(.2,1.5,.4,1) both}
  .cap.tech{background:#fff;color:var(--navy)}
  @keyframes slam{from{opacity:0;transform:scale(1.6) rotate(-1.5deg)}to{opacity:1;transform:scale(1) rotate(-1.5deg)}}
  @media (prefers-reduced-motion:reduce){ .cap{animation:none} }

  /* ---------- notice card ---------- */
  .card{background:#fff;border:3px solid var(--panel-border);border-radius:16px;padding:18px;margin:8px 4px;
    box-shadow:5px 5px 0 rgba(0,0,0,.28);z-index:5;animation:pop .35s ease both}
  .card h3{font-family:'Bangers',cursive;letter-spacing:.06em;font-size:20px;color:var(--red);margin-bottom:10px}
  .card ul{list-style:none} .card li{font-size:13.5px;line-height:1.5;padding-inline-start:18px;position:relative;margin-bottom:8px}
  .card li::before{content:"";position:absolute;inset-inline-start:2px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--navy)}

  /* ---------- controls ---------- */
  .controls{flex-shrink:0;background:#fff;border-top:2.5px solid var(--panel-border);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;z-index:6}
  .btn{font-family:inherit;font-weight:700;font-size:13.5px;border:none;cursor:pointer;border-radius:999px;
    padding:11px 18px;transition:transform .1s,background .2s}
  .btn:active{transform:scale(.97)} .btn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .btn-red{background:var(--red);color:#fff;flex:1}
  .btn-ghost{background:#eef5fc;color:var(--navy);border:2px solid #cdd9ea}
  .btn[disabled]{opacity:.45;cursor:default}
  .hint{font-size:11px;color:var(--muted);text-align:center;padding:0 16px 8px;background:#fff;z-index:6}

  /* ---------- intro / end ---------- */
  .screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px;color:#fff;transition:opacity .5s,visibility .5s;
    background:linear-gradient(180deg,rgba(0,10,28,.93),rgba(0,24,56,.96)), center/cover no-repeat;}
  .screen.hidden{opacity:0;visibility:hidden}
  .screen .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.75;font-weight:700}
  .screen h1{font-family:'Bangers',cursive;letter-spacing:.04em;font-size:40px;margin:8px 0 2px;line-height:1}
  .screen h2{font-size:13.5px;font-weight:600;opacity:.82;margin-bottom:20px;max-width:320px}
  .screen p{font-size:13.5px;line-height:1.6;max-width:330px;opacity:.92;margin-bottom:12px}
  .screen .persona{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);border-radius:14px;
    padding:12px 15px;font-size:12.5px;line-height:1.55;max-width:330px;margin:6px 0 22px;text-align:start}
  .screen .btn-red{flex:none;padding:14px 32px;font-size:15px}
  .endlist{text-align:start;max-width:330px;margin:4px 0 18px}
  .endlist li{font-size:13px;line-height:1.5;margin-bottom:9px;padding-inline-start:18px;position:relative;list-style:none;opacity:.95}
  .endlist li::before{content:"";position:absolute;inset-inline-start:0;top:6px;width:8px;height:8px;border-radius:50%;background:var(--red)}
  .screen .btn-ghost{color:#fff;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35)}

  /* Fullscreen button — comic vocabulary: pill, ink border, hard offset
     shadow, press-to-squash. A direct child of .stage at z-index 25, NOT in
     the topbar: the intro and end .screen overlays sit at z-index 20 and would
     bury a topbar button on exactly the screens a stuck learner needs it. */
  /* Fullscreen button -- centred at the top of the stage and deliberately loud.
     z-index sits above .screen (20) so it is reachable from the intro screen,
     before the learner has started. Solid green rather than the comic
     vocabulary, so it reads as player chrome rather than part of the story. */
  .fs-btn{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:25;
    display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 16px;
    background:var(--fs-green);color:#fff;
    border:0;border-radius:999px;
    box-shadow:0 2px 10px rgba(0,0,0,.45);
    font-family:inherit;font-size:12.5px;font-weight:800;letter-spacing:.02em;
    white-space:nowrap;cursor:pointer;transition:background .15s,box-shadow .15s}
  .fs-btn:hover{background:var(--fs-green-deep)}
  .fs-btn:active{transform:translateX(-50%) translateY(1px)}
  .fs-btn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  /* once fullscreen, it has done its job -- recede into the navy topbar */
  .fs-btn.is-on{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}

  /* language switcher — lives on the intro screen, where there is room and
     where a learner chooses once. ?lang= remains the primary mechanism for
     LMS embeds. */
  .langbar{margin:0 0 14px}
  .langbar select{font:inherit;font-size:12.5px;font-weight:700;color:#fff;
    background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);
    border-radius:999px;padding:6px 14px;cursor:pointer}
  .langbar select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .langbar option{color:#132441}

  /* ---------- right-to-left (Arabic) ----------
     Two separate jobs here, and only one of them is a mirror.

     MIRRORED: reading-order chrome. The progress rail, the topbar row and the
     fullscreen button all flip on their own because they use flex and logical
     properties, so they need nothing.

     NOT MIRRORED: anything anchored to the photograph. Jack physically sits on
     the left of the frame and the Consultant on the right, so their bubbles,
     nameplates and the speaker spotlight stay where the people are. Under
     dir=rtl the cross-axis flex-start/flex-end of .bubbles would otherwise
     swap the two speakers over and point each tail at the wrong person, so
     they are pinned back explicitly below.

     Bangers is a Latin-only display face — Arabic text in it silently falls
     back to whatever the OS picks, which reads as a different design. So every
     Bangers rule swaps to Noto Sans Arabic in RTL. */
  [dir="rtl"] body,
  [dir="rtl"] .bubble,
  [dir="rtl"] .screen,
  [dir="rtl"] .card,
  [dir="rtl"] .btn{font-family:'Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif}
  [dir="rtl"] .nameplate,
  [dir="rtl"] .cap,
  [dir="rtl"] .bubble .sp,
  [dir="rtl"] .bubble.thinking,
  [dir="rtl"] .card h3,
  [dir="rtl"] .screen h1{font-family:'Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
    font-weight:800;letter-spacing:0}
  [dir="rtl"] .screen h1{font-size:30px;line-height:1.25}
  [dir="rtl"] .cap{font-size:12.5px}
  [dir="rtl"] .seg .lab{font-size:8.2px}
  /* keep each speaker on their own side of the photo */
  [dir="rtl"] .bubble.jack{align-self:flex-end}
  [dir="rtl"] .bubble.con{align-self:flex-start}
</style>
</head>
<body>
<div class="stage">

  <button class="fs-btn" id="fsBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg><span class="fs-label" aria-live="polite"></span></button>

  <div class="screen" id="intro">
    <div class="kicker" id="i-kicker"></div>

    "الخطوات السحرية الثلاث: تقبّل واحترم، اسأل وافهم، عالج",
    "أنصت إلى إشارة الشراء وساعد جاك على الاختيار"
  ],
  lines:[
    "«إذن يا جاك، هدفك أن تتحدث الإنجليزية بثقة في عملك الجديد، ومرة واحدة أسبوعيًا تناسب سفرك. هل هذا صحيح؟»",
    "«نعم، بالضبط. أريد أن أتوقف عن الخوف الشديد من ارتكاب الأخطاء عندما أتحدث.»",
    "«لديّ خياران جيدان لك. دورة الاثني عشر شهرًا تأخذك حتى التحدث بثقة. لكن بما أنك ذكرت أن لديك موعدًا نهائيًا، فإن دورة التسعة أشهر بداية قوية يمكنك البناء عليها. وكلتاهما تناسبان سفرك.»",
    "«هذه المرونة هي بالضبط ما أحتاجه، مع كل هذا السفر.»",
    "«دورة الاثني عشر شهرًا تشمل كل ما عرضته عليك. الصفوف الصغيرة — Encounters، والنوادي الاجتماعية، والكثير من حصص المحادثة، ومدربك ومعلميك، وكل موادك الدراسية. الاستثمار في كل هذا هو ٢٬٠٠٠ دولار.»",
    "(تنظر إلى جاك بهدوء ولا تقول شيئًا على الإطلاق.)",
    "«...حسنًا. نعم. هذا مبلغ كبير بالنسبة لي، لأكون صادقًا معك.»",
    "«أنت محق، إنه استثمار كبير في مستقبلك وأنا أتفهم، إنه قرار مهم. هل لي أن أسألك ماذا تقصد بمبلغ كبير، وما المبلغ الذي كنت تتوقعه؟ لهذا السبب بالذات نمنحك ضمانًا مكتوبًا. اتبع الطريقة، وإن لم تصل إلى هدفك نُعيد إليك أموالك. أنت تمنحنا الوقت، ونحن نوصلك إلى هناك.»",
    "«همم، هذا يريحني فعلًا.»",
    "«ممتاز. متى تود أن تبدأ — هذا الأسبوع أم الأسبوع القادم؟»",
    "«حسنًا... بصراحة، ما زال يبدو لي غاليًا جدًا.»",
    "«أتفهمك، والسعر مهم فعلًا في قرار كبير كهذا. كثير من الناس يشعرون بذلك في البداية.»",
    "«هل لي أن أسألك ماذا تقصد تحديدًا بغالٍ جدًا؟»",
    "«بصراحة، دخلي ليس كبيرًا بعد. لست متأكدًا من قدرتي على دفع المبلغ كاملًا دفعة واحدة الآن.»",
    "«شكرًا لصراحتك معي. هذه ليست مشكلة على الإطلاق. لننظر معًا في خيارات الدفع الشهري، وسنجد حلًا. ويمكننا أيضًا أن نجد مدة دورة تناسب ميزانيتك، حتى تتمكن من البدء الآن. ما رأيك؟»",

    "«حسنًا، أريد أن أبدأ. لكنني فقط غير متأكد: أدفع شهريًا أم أجد طريقة لدفع المبلغ كاملًا دفعة واحدة، لأنه أرخص بكثير.»",
    "«سؤال جيد. يبدو أنك مستعد للبدء. معظم من هم في وضعك يختارون خطة الدفع الشهري. وهي أيضًا خيار جيد وتمنحك مرونة مالية أكبر. هل نرتّب الأمر على هذا الأساس ونبدأ؟»",
    "«نعم، لنفعل ذلك. شكرًا لأنك جعلت الأمر بهذه السهولة.»"
  ],
  caps:{
    0:"<b>إغلاق جزئي.</b> تعيد صياغة هدف جاك. وتحصل على «نعم» قبل أن تعرض عليه الدورة.",
    2:"<b>خياران.</b> أحدهما يحقق هدفه، والآخر بداية جيدة. جاك هو من يختار، وكلاهما يؤدي إلى البدء.",
    4:"<b>عرض هادئ للسعر.</b> تقول «استثمار» لا «سعر». وتذكر المبلغ كاملًا بثقة ووضوح.",
    5:"<b>التزم الصمت.</b> تترك لجاك فرصة التفكير. من يتكلم أولًا يخسر غالبًا. لذلك تنتظر.",
    7:"<b>الضمان.</b> الآن يبدو الاستثمار الكبير آمنًا ومضمونًا.",
    9:"<b>الإغلاق البديل.</b> إجابتان سهلتان، وكلتاهما تعني «نعم».",
    11:"<b>الخطوة ١ — تقبّل واحترم.</b> تأخذ شعوره على محمل الجد. ولا تجادله.",
    12:"<b>الخطوة ٢ — اسأل وافهم.</b> تطرح سؤالًا مفتوحًا لتصل إلى الشك الحقيقي.",
    14:"<b>الخطوة ٣ — عالج الاعتراض.</b> كان شكّه الحقيقي هو دفع مبلغ كبير دفعة واحدة. لذلك تعرض عليه الدفع الشهري.",
    16:"<b>إشارة شراء.</b> هذا ليس اعتراضًا. جاك قرر بالفعل. هو يحتاج مساعدة في اختيار صغير.",
    17:"<b>ساعده على الاختيار ثم أغلق.</b> تساعده في الاختيار الصغير. ثم تطلب منه أن يبدأ."
  }
}

};

const LANG_NAMES={en:"English",it:"Italiano",pt:"Português",es:"Español",fr:"Français",ar:"العربية"};
const RTL=["ar"];

function normalizeLang(l){
  if(!l) return "en";
  l=String(l).toLowerCase();
  if(I18N[l]) return l;
  const base=l.split("-")[0];
  return I18N[base]?base:"en";
}
/* ?lang= wins, then the browser, then English. Switching reloads with a new
   ?lang= rather than re-rendering in place — the activity is stateful and a
   half-rendered language swap is a worse bug than a reload. */
const LANG=normalizeLang(new URLSearchParams(location.search).get("lang")||navigator.language);
document.documentElement.lang=LANG;
document.documentElement.dir=RTL.indexOf(LANG)>=0?"rtl":"ltr";

const UI=I18N[LANG];
/* rebuild the beat list the player expects from shared structure + this
   language's text */
const SCRIPT=BEATS.map((b,i)=>{
  const o={phase:b.phase,who:b.who===1?"con":"jack",text:UI.lines[i]};
  if(b.cap&&UI.caps[i]) o.chip={kind:"",label:UI.caps[i]};
  return o;
});
/* =========================================================================
   ADAPTER — UI + SCRIPT above  ->  STR / LINES / NOTICES below.

   The data block is deliberately left in its original shape so copy edits
   land in one place and merge cleanly. Everything the comic player needs is
   derived from it at runtime, which means a change to a chip.label keeps
   driving BOTH the caption chip and the notice card with no duplication.

   Every chip.label in this scenario has the shape
       "<b>Lead.</b> One or two explanatory sentences."
   A rotated Bangers sticker cannot hold the explanation, so:
     - the <b>lead</b> becomes the caption chip (.cap.tech)
     - the whole label becomes a bullet on that phase's notice card
   The first line of each phase additionally gets the red "!"-prefixed phase
   chip, which is the convention the reference comic uses.
   ========================================================================= */
const LEAD = /^<b>(.*?)<\/b>\s*/;
const firstOf = {}, lastOf = {};
SCRIPT.forEach((b,i)=>{ if(!(b.phase in firstOf)) firstOf[b.phase]=i; lastOf[b.phase]=i; });

const STR = {
  kicker:UI.kicker, title:UI.title, sub:UI.sub, intro:UI.intro, persona:UI.persona,
  start:UI.start, topTitle:UI.topTitle,
  nameJack:UI.jack, nameCon:UI.consultant,
  spJack:UI.jack,   spCon:UI.consultant,
  next:UI.next, finish:UI.finish, cont:UI.cont,
  hintTap:UI.tapHint,
  noticeTitle:UI.noticeTitle,
  endKicker:UI.endKicker, endTitle:UI.endTitle, endSub:UI.endSub,
  endBullets:UI.techniques,
  replay:UI.replay,
  phases:UI.steps
};

/* who: 0 = Jack (left of frame), 1 = Consultant (right of frame) */
const LINES = SCRIPT.map((b,i)=>{
  const o = { who: b.who==="jack"?0:1, phase:b.phase, t:b.text, audio:null };
  if(i===firstOf[b.phase])      o.cap = "!"+UI.steps[b.phase];
  else if(b.chip && LEAD.test(b.chip.label))
                                o.cap = b.chip.label.match(LEAD)[1].replace(/[.·\s]+$/,"");
  return o;
});

const NOTICES = {};
SCRIPT.forEach(b=>{
  if(!b.chip) return;
  const k = lastOf[b.phase];
  (NOTICES[k] = NOTICES[k] || []).push(b.chip.label);
});

/* =========================================================================
   PLAYER — generic over STR / LINES / NOTICES. Copied from the Show-section
   template; the only changes are the ana -> con speaker rename and the
   left/right swap that keeps Jack on the side of the frame he sits on.
   ========================================================================= */
const $=id=>document.getElementById(id);
const bubbles=$("bubbles");
let idx=-1, waiting=false, done=false;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

$("i-kicker").textContent=STR.kicker; $("i-title").textContent=STR.title;
$("i-sub").textContent=STR.sub; $("i-body").textContent=STR.intro;
$("i-persona").innerHTML=STR.persona; $("i-start").textContent=STR.start;
$("t-title").textContent=STR.topTitle;
$("np-jack").textContent=STR.nameJack; $("np-con").textContent=STR.nameCon;
$("e-kicker").textContent=STR.endKicker; $("e-title").textContent=STR.endTitle;
$("e-sub").textContent=STR.endSub; $("e-replay").textContent=STR.replay;
STR.endBullets.forEach(b=>{const li=document.createElement("li");li.textContent=b;$("e-list").appendChild(li);});
STR.phases.forEach(pn=>{const s=document.createElement("div");s.className="seg";
  s.innerHTML='<div class="bar"></div><div class="lab"></div>';
  s.lastChild.textContent=pn;$("rail").appendChild(s);});
const segs=[...document.querySelectorAll(".seg")];
$("t-count").textContent="1 / "+LINES.length;

$("hint").textContent=STR.hintTap;
$("b-next").textContent=STR.next;

function railTo(p){segs.forEach((s,i)=>{s.classList.toggle("done",i<p);s.classList.toggle("now",i===p);});}
function spotlight(who){
  $("np-jack").classList.toggle("dim",who!==0);
  $("np-con").classList.toggle("dim",who!==1);
  const fx=$("flash"); fx.style.setProperty("--fx",who===0?"32%":"75%");
  fx.style.opacity=".9"; setTimeout(()=>fx.style.opacity="0",380);
}
function scrollDown(){bubbles.scrollTop=bubbles.scrollHeight;}
function dimOld(){[...bubbles.querySelectorAll(".bubble")].forEach(b=>b.classList.add("dimmed"));}

function addCap(cap){
  const phase=cap.startsWith("!");
  const w=document.createElement("div");w.className="capwrap";
  const c=document.createElement("div");c.className="cap"+(phase?"":" tech");
  c.textContent=phase?cap.slice(1):cap;
  w.appendChild(c);bubbles.appendChild(w);scrollDown();
}
function addBubble(L){
  const b=document.createElement("div");b.className="bubble "+(L.who===0?"jack":"con");
  const sp=document.createElement("span");sp.className="sp";
  sp.textContent=(L.who===0?STR.spJack:STR.spCon);
  const t=document.createElement("span");t.textContent=L.t;
  b.appendChild(sp);b.appendChild(t);
  bubbles.appendChild(b);scrollDown();
}

function playLine(i,then){
  const L=LINES[i];
  dimOld(); spotlight(L.who); railTo(L.phase);
  if(L.cap)addCap(L.cap);
  const think=document.createElement("div");
  think.className="bubble "+(L.who===0?"jack":"con")+" thinking";
  think.textContent="…";
  bubbles.appendChild(think);scrollDown();
  const waitMs=reduce?0:200;
  setTimeout(()=>{
    think.remove(); addBubble(L);
    $("t-count").textContent=(i+1)+" / "+LINES.length;
    /* the last beat closes the story, so the button says Finish there */
    $("b-next").textContent=(i>=LINES.length-1)?STR.finish:STR.next;
    if(L.audio){const a=new Audio(L.audio);a.onended=()=>then&&then();
      a.play().catch(()=>then&&then());}
    else then&&then();
  },waitMs);
}
function showNotice(bs,resume){
  const c=document.createElement("div");c.className="card";
  const h=document.createElement("h3");h.textContent=STR.noticeTitle;
  const ul=document.createElement("ul");
  bs.forEach(b=>{const li=document.createElement("li");li.innerHTML=b;ul.appendChild(li);});
  const btn=document.createElement("button");btn.className="btn btn-red";
  btn.style.marginTop="4px";btn.textContent=STR.cont;
  c.appendChild(h);c.appendChild(ul);c.appendChild(btn);
  bubbles.appendChild(c);scrollDown();waiting=true;
  btn.onclick=()=>{waiting=false;btn.remove();resume();};btn.focus();
}
function advance(){
  if(waiting||done)return;
  idx++;
  if(idx>=LINES.length){finish();return;}
  /* Capture the beat index. The callback fires after the "thinking" delay,
     and a learner who taps Next inside that window would otherwise have the
     PREVIOUS beat's callback read the new idx -- firing that beat's notice
     card early and then again when its own callback lands. */
  const i=idx;
  playLine(i,()=>{
    if(NOTICES[i])showNotice(NOTICES[i],()=>{});
  });
}
function finish(){done=true;setTimeout(()=>$("end").classList.remove("hidden"),700);}

$("i-start").onclick=()=>{$("intro").classList.add("hidden");setTimeout(advance,500);};
$("b-next").onclick=()=>advance();
$("e-replay").onclick=()=>location.reload();
document.addEventListener("keydown",e=>{
  if(!$("intro").classList.contains("hidden"))return;
  if(e.key===" "||e.key==="Enter"||e.key==="ArrowRight"){e.preventDefault();advance();}
});

/* ===== fullscreen =====
   The stage sizes itself to whatever box it is embedded in, and we do not
   control that box. An LMS iframe taller than the learner's visible area puts
   the lower half of the activity below the fold, where nothing inside the
   iframe can detect it. This is the escape hatch.

   Our LMS embed grants allowfullscreen, so this is a real Fullscreen API
   call, never a new tab: popping out to a tab loses the learner's place in
   the course and orphans them outside the player. The only fallback left is
   an inline F11 hint. Ported from SANDBOXTEMPLATE; the toast and i18n
   lookups it relied on do not exist here, so the labels come from the
   activity's own copy object. */
const FS = UI.fs;
const FS_W = 920, FS_H = 620;
const fsBtn = document.getElementById("fsBtn");
const fsLabelEl = fsBtn && fsBtn.querySelector(".fs-label");
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;
// false when the embedding iframe carries no allowfullscreen
const fsSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
let fsMode = fsSupported ? "fullscreen" : "hint";
let fsHintTimer;

function syncFsLabel(){
  if(!fsBtn) return;
  const on = !!fsEl();
  const t = on ? FS.exit : FS.enter;
  fsLabelEl.textContent = t; fsBtn.title = t;
  fsBtn.classList.toggle("is-on", on);
  fsBtn.setAttribute("aria-pressed", on ? "true" : "false");
}
// there is no toast component in these activities, so the hint borrows the
// button's own label for a few seconds
function fsHint(){
  if(!fsBtn) return;
  fsLabelEl.textContent = FS.hint; fsBtn.title = FS.hint;
  clearTimeout(fsHintTimer); fsHintTimer = setTimeout(syncFsLabel, 4000);
}
function fsDemote(){ fsMode = "hint"; syncFsLabel(); fsHint(); }

/* Scale the stage rather than stretch it. This is a fixed 920xH design, so
   plain fullscreen on a large monitor would just centre a postage stamp in a
   huge field and read as broken. Text scales as vectors and nothing reflows. */
function fitStage(){
  const st = document.querySelector(".stage"); if(!st) return;
  const s = fsEl() ? Math.min(innerWidth / FS_W, innerHeight / FS_H) : 1;
  st.style.setProperty("--fs-scale", Math.max(1, Math.min(2, s)).toFixed(3));
}

function toggleFullscreen(){
  if(fsMode === "hint"){ fsHint(); return; }
  if(fsEl()){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  /* documentElement, NOT .stage: element fullscreen forces width/height:100%
     over the fixed design and paints an opaque black ::backdrop, which would
     replace the activity's own ground. */
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(!req){ fsDemote(); return; }
  // webkitRequestFullscreen returns undefined rather than a Promise, and a
  // request can still be refused after fullscreenEnabled read true
  Promise.resolve(req.call(el)).catch(fsDemote);
}

if(fsBtn) fsBtn.addEventListener("click", toggleFullscreen);
/* The change event is the source of truth, never the click handler: Esc, F11,
   a refused request and the window manager all change state without it. */
["fullscreenchange","webkitfullscreenchange"].forEach(ev =>
  document.addEventListener(ev, () => { syncFsLabel(); fitStage(); }));
addEventListener("resize", fitStage);
syncFsLabel(); fitStage();

/* ----- language switcher ----- */
(function(){
  const sel=document.getElementById("langsel"); if(!sel) return;
  Object.keys(I18N).forEach(c=>{
    const o=document.createElement("option");
    o.value=c; o.textContent=LANG_NAMES[c]||c; if(c===LANG) o.selected=true;
    sel.appendChild(o);
  });
  sel.addEventListener("change",()=>{
    const u=new URL(location.href); u.searchParams.set("lang",sel.value); location.href=u.toString();
  });
})();
</script>
